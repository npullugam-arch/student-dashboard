<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No Internet — EduConnect</title>
    <style>
        /* ── Reset & Root ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #eef4fb;
            --card: #ffffff;
            --primary: #3b82f6;
            --primary2: #2563eb;
            --accent: #f59e0b;
            --green: #10b981;
            --soft: #dbeafe;
            --text: #1e3a5f;
            --sub: #64748b;
            --radius: 24px;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ── Floating Background Shapes ── */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.12;
            animation: floatBg 8s ease-in-out infinite;
        }

        .shape-1 {
            width: 320px;
            height: 320px;
            background: var(--primary);
            top: -80px;
            left: -80px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: var(--accent);
            bottom: -60px;
            right: -60px;
            animation-delay: -3s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: var(--green);
            top: 40%;
            right: 5%;
            animation-delay: -5s;
        }

        .shape-4 {
            width: 100px;
            height: 100px;
            background: var(--primary);
            bottom: 15%;
            left: 8%;
            animation-delay: -1.5s;
        }

        @keyframes floatBg {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(20px) scale(1.05);
            }
        }

        /* ── Floating Edu-Icons ── */
        .edu-icons {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .edu-icon {
            position: absolute;
            font-size: 1.6rem;
            opacity: 0.18;
            animation: floatIcon 6s ease-in-out infinite;
            user-select: none;
        }

        .edu-icon:nth-child(1) {
            top: 10%;
            left: 12%;
            animation-delay: 0s;
            font-size: 2rem;
        }

        .edu-icon:nth-child(2) {
            top: 18%;
            right: 14%;
            animation-delay: -2s;
        }

        .edu-icon:nth-child(3) {
            top: 70%;
            left: 6%;
            animation-delay: -4s;
            font-size: 2.2rem;
        }

        .edu-icon:nth-child(4) {
            bottom: 12%;
            right: 10%;
            animation-delay: -1s;
        }

        .edu-icon:nth-child(5) {
            top: 45%;
            left: 3%;
            animation-delay: -3s;
            font-size: 1.3rem;
        }

        .edu-icon:nth-child(6) {
            top: 30%;
            right: 4%;
            animation-delay: -5s;
        }

        .edu-icon:nth-child(7) {
            bottom: 25%;
            left: 20%;
            animation-delay: -2.5s;
        }

        .edu-icon:nth-child(8) {
            top: 8%;
            right: 30%;
            animation-delay: -0.8s;
            font-size: 1.2rem;
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            33% {
                transform: translateY(-14px) rotate(5deg);
            }

            66% {
                transform: translateY(8px) rotate(-4deg);
            }
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card);
            border-radius: var(--radius);
            padding: 52px 48px 44px;
            max-width: 520px;
            width: 92%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(59, 130, 246, .13), 0 4px 16px rgba(0, 0, 0, .06);
            animation: cardIn .7s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── WiFi SVG ── */
        .wifi-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 28px;
        }

        /* Pulsing ring behind the icon */
        .pulse-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            opacity: 0;
            animation: pulseRing 2.4s ease-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: .8s;
        }

        .pulse-ring:nth-child(3) {
            animation-delay: 1.6s;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(.6);
                opacity: .6;
            }

            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        /* WiFi icon circle */
        .wifi-circle {
            position: relative;
            z-index: 2;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bobble 3s ease-in-out infinite;
        }

        @keyframes bobble {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* Wifi SVG arcs animation */
        .wifi-svg {
            width: 64px;
            height: 64px;
        }

        .arc {
            fill: none;
            stroke: var(--primary);
            stroke-width: 5;
            stroke-linecap: round;
            animation: arcFade 2s ease-in-out infinite;
        }

        .arc-1 {
            animation-delay: 0s;
            opacity: .3;
        }

        .arc-2 {
            animation-delay: .35s;
            opacity: .3;
        }

        .arc-3 {
            animation-delay: .7s;
            opacity: .3;
        }

        .dot {
            fill: var(--primary);
            animation: arcFade 2s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes arcFade {

            0%,
            100% {
                opacity: .25;
            }

            50% {
                opacity: 1;
            }
        }

        /* Cross / slash */
        .slash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 56px;
            height: 6px;
            background: #ef4444;
            border-radius: 4px;
            transform: translate(-50%, -50%) rotate(-40deg);
            z-index: 3;
            animation: slashPulse 2s ease-in-out infinite;
        }

        @keyframes slashPulse {

            0%,
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-40deg) scaleX(1);
            }

            50% {
                opacity: .7;
                transform: translate(-50%, -50%) rotate(-40deg) scaleX(.92);
            }
        }

        /* ── Badge ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 99px;
            padding: 5px 14px;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-bottom: 14px;
            animation: badgePop .5s .3s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes badgePop {
            from {
                opacity: 0;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.25;
            margin-bottom: 10px;
            animation: fadeUp .5s .4s both;
        }

        .sub {
            font-size: .98rem;
            color: var(--sub);
            line-height: 1.65;
            margin-bottom: 28px;
            animation: fadeUp .5s .5s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Tips row ── */
        .tips {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            animation: fadeUp .5s .6s both;
        }

        .tip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--soft);
            color: var(--primary2);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: .82rem;
            font-weight: 600;
            transition: transform .2s;
        }

        .tip:hover {
            transform: translateY(-3px);
        }

        .tip-icon {
            font-size: 1rem;
        }

        /* ── Retry Button ── */
        .btn-wrap {
            animation: fadeUp .5s .7s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(59, 130, 246, .38);
            transition: transform .2s, box-shadow .2s, opacity .2s;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .15);
            transform: translateX(-100%);
            transition: transform .35s;
        }

        .btn:hover::after {
            transform: translateX(0);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(59, 130, 246, .45);
        }

        .btn:active {
            transform: scale(.97);
        }

        /* Spinner inside button */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn.loading .btn-text {
            opacity: .5;
        }

        .btn.loading .spinner {
            display: block;
        }

        .btn.loading .btn-arrow {
            display: none;
        }

        /* ── Countdown ── */
        .countdown-wrap {
            margin-top: 18px;
            font-size: .82rem;
            color: var(--sub);
            animation: fadeUp .5s .8s both;
            min-height: 20px;
        }

        #countdown {
            font-weight: 700;
            color: var(--primary);
        }

        /* ── Status dot ── */
        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
            font-size: .8rem;
            color: var(--sub);
            animation: fadeUp .5s .9s both;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ef4444;
            animation: statusBlink 1.5s ease-in-out infinite;
        }

        .status-dot.online {
            background: var(--green);
            animation: none;
        }

        @keyframes statusBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }
        }

        /* ── Role Tags ── */
        .roles {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
            animation: fadeUp .5s 1s both;
        }

        .role-tag {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: .73rem;
            font-weight: 700;
            letter-spacing: .03em;
        }

        .role-student {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .role-teacher {
            background: #d1fae5;
            color: #065f46;
        }

        .role-admin {
            background: #ede9fe;
            color: #5b21b6;
        }

        /* ── Footer text ── */
        .footer-note {
            margin-top: 24px;
            font-size: .75rem;
            color: #94a3b8;
            animation: fadeUp .5s 1.1s both;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 40px 24px 32px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .tips {
                gap: 7px;
            }
        }
    </style>
</head>

<body>

    <!-- BG Decorative Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <!-- Floating Edu Icons -->
    <div class="edu-icons">
        <span class="edu-icon">📚</span>
        <span class="edu-icon">✏️</span>
        <span class="edu-icon">🎓</span>
        <span class="edu-icon">📐</span>
        <span class="edu-icon">🔬</span>
        <span class="edu-icon">🖊️</span>
        <span class="edu-icon">📓</span>
        <span class="edu-icon">⭐</span>
    </div>

    <!-- Main Card -->
    <div class="card">

        <!-- WiFi Animation -->
        <div class="wifi-wrap">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="wifi-circle">
                <svg class="wifi-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Arc 3 (outermost) -->
                    <path class="arc arc-3" d="M10 28 Q32 10 54 28" stroke-width="5" stroke-linecap="round" />
                    <!-- Arc 2 -->
                    <path class="arc arc-2" d="M17 35 Q32 22 47 35" stroke-width="5" stroke-linecap="round" />
                    <!-- Arc 1 (innermost) -->
                    <path class="arc arc-1" d="M24 42 Q32 34 40 42" stroke-width="5" stroke-linecap="round" />
                    <!-- Dot -->
                    <circle class="dot" cx="32" cy="50" r="4" />
                </svg>
            </div>
            <!-- Red Slash -->
            <div class="slash"></div>
        </div>

        <!-- Badge -->
        <div class="badge">⚠️ Connection Lost</div>

        <!-- Heading -->
        <h1>Oops! You're Offline</h1>

        <!-- Subtitle -->
        <p class="sub">
            It looks like your internet connection took a little break.<br>
            Check your network and try reconnecting — your learning can't wait!
        </p>

        <!-- Retry Button -->
        <div class="btn-wrap">
            <button class="btn" id="retryBtn" onclick="retryConnection()">
                <div class="spinner" id="spinner"></div>
                <span class="btn-text" id="btnText">Retry Connection</span>
                <span class="btn-arrow" id="btnArrow">→</span>
            </button>
        </div>

        <!-- Countdown -->
        <div class="countdown-wrap">
            <span id="countdownMsg"></span>
        </div>

        <!-- Status -->
        <div class="status-row">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">No internet detected</span>
        </div>

        <!-- Role Tags -->


        <!-- Footer -->
        <p class="footer-note">EduConnect School Portal · Please stay connected for the best experience</p>
    </div>

    <script>
        /* ── Retry Logic ── */
        let retryTimer = null;
        let countdown = 0;

        function retryConnection() {
            const btn = document.getElementById('retryBtn');
            const spinner = document.getElementById('spinner');
            const msg = document.getElementById('countdownMsg');
            const dot = document.getElementById('statusDot');
            const status = document.getElementById('statusText');

            // Loading state
            btn.classList.add('loading');
            msg.textContent = 'Checking connection…';

            // Simulate a check (1.8s)
            setTimeout(() => {
                btn.classList.remove('loading');

                // Check actual navigator.onLine
                if (navigator.onLine) {
                    // ✅ Online
                    dot.classList.add('online');
                    status.textContent = 'Connected! Redirecting…';
                    msg.textContent = '✅ Connection restored!';
                    btn.style.background = 'linear-gradient(135deg,#10b981,#059669)';
                    clearInterval(retryTimer);
                    setTimeout(() => {
                        window.location.reload();
                    }, 1200);
                } else {
                    // ❌ Still offline — start 15s countdown
                    status.textContent = 'Still offline…';
                    dot.classList.remove('online');
                    startCountdown(15);
                }
            }, 1800);
        }

        function startCountdown(secs) {
            const msg = document.getElementById('countdownMsg');
            countdown = secs;
            clearInterval(retryTimer);
            updateMsg();
            retryTimer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(retryTimer);
                    retryConnection();
                } else {
                    updateMsg();
                }
            }, 1000);
        }

        function updateMsg() {
            const msg = document.getElementById('countdownMsg');
            msg.innerHTML = `Auto-retrying in <span id="countdown">${countdown}s</span>`;
        }

        /* ── Detect online event ── */
        window.addEventListener('online', () => {
            const dot = document.getElementById('statusDot');
            const status = document.getElementById('statusText');
            const msg = document.getElementById('countdownMsg');
            dot.classList.add('online');
            status.textContent = 'Back online! Refreshing…';
            msg.textContent = '✅ Connection restored!';
            clearInterval(retryTimer);
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });

        window.addEventListener('offline', () => {
            const dot = document.getElementById('statusDot');
            const status = document.getElementById('statusText');
            dot.classList.remove('online');
            status.textContent = 'No internet detected';
        });

        // Auto-start countdown on load
        window.addEventListener('load', () => {
            startCountdown(20);
        });
    </script>

</body>

</html>
