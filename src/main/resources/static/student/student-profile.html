<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="student-profile.css" />
</head>
<body>

  <div class="profile-container">

    <div class="profile-card">
      <img id="profilePic" src="/assets/images/default-student.png" alt="Profile" />
      <h2 id="studentName">Student Name</h2>
      <p id="studentClass">Class - Section</p>
    </div>

    <div class="details-card">
      <h3>Personal Details</h3>
      <div class="grid">
        <div><b>Student ID:</b> <span id="studentId"></span></div>
        <div><b>Date of Birth:</b> <span id="dob"></span></div>
        <div><b>Gender:</b> <span id="gender"></span></div>
        <div><b>Caste:</b> <span id="caste"></span></div>
        <div><b>Religion:</b> <span id="religion"></span></div>
      </div>
    </div>

    <div class="details-card">
      <h3>Academic Details</h3>
      <div class="grid">
        <div><b>Standard:</b> <span id="standard"></span></div>
        <div><b>Section:</b> <span id="section"></span></div>
        <div><b>Academic Year:</b> <span id="academicYear"></span></div>
      </div>
    </div>

    <div class="details-card">
      <h3>Contact Details</h3>
      <div class="grid">
        <div><b>Phone:</b> <span id="phone"></span></div>
        <div><b>Parent Phone:</b> <span id="parentPhone"></span></div>
        <div><b>Email:</b> <span id="studentEmail"></span></div>
        <div><b>Parent Email:</b> <span id="parentEmail"></span></div>
      </div>
    </div>

  </div>

  <script src="student-profile.js"></script>
</body>
</html>
