<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin • Teacher Passwords</title>
  <link rel="stylesheet" href="/admin/admin-teacher-passwords.css"/>
</head>

<body>
  <div class="tp-wrap">

    <!-- Topbar -->
    <header class="tp-top">
      <div class="tp-brand">
        <div class="tp-logo">👩‍🏫</div>
        <div>
          <div class="tp-title">EduConnect</div>
          <div class="tp-sub">Admin • Reset Teacher Passwords</div>
        </div>
      </div>

      <div class="tp-actions">
        <button class="tp-btn ghost" id="btnBack" type="button">← Back</button>
        <button class="tp-btn dark" id="btnLogout" type="button">Logout</button>
      </div>
    </header>

    <!-- Filters/Search -->
    <section class="tp-filters tp-card">
      <div class="tp-filter-grid">
        <div class="tp-field">
          <span>Search (Teacher ID / Name / Subject)</span>
          <div class="tp-searchbox">
            <span class="tp-search-ico">🔎</span>
            <input id="searchInput" type="text" placeholder="Type teacher name or teacher ID..." autocomplete="off"/>
            <button class="tp-icon-btn" id="clearSearchBtn" type="button" title="Clear">✕</button>
          </div>
        </div>

        <div class="tp-field tp-field-actions">
          <span>&nbsp;</span>
          <button class="tp-btn primary" id="btnLoad" type="button">Load Teachers</button>
        </div>
      </div>

      <div class="tp-hint">
        Tip: Click <b>Load Teachers</b> → then search by teacher name or ID.
      </div>
    </section>

    <!-- Results -->
    <main class="tp-main">
      <section class="tp-card">
        <div class="tp-card-head">
          <h2>Teachers</h2>
          <div class="tp-meta">
            <span id="countPill" class="tp-pill">0</span>
            <span class="tp-muted" id="infoPill">Not loaded</span>
          </div>
        </div>

        <div id="list" class="tp-grid">
          <div class="tp-empty">
            Click <b>Load Teachers</b> to view list.
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- ✅ Reset Password Modal -->
  <div id="rpBackdrop" class="rp-backdrop rp-hidden" aria-hidden="true">
    <div class="rp-modal" role="dialog" aria-modal="true" aria-labelledby="rpTitle">
      <div class="rp-head">
        <div>
          <h3 class="rp-title" id="rpTitle">Reset Password</h3>
          <p class="rp-sub" id="rpSub">Teacher: —</p>
        </div>
        <button class="rp-close" id="rpClose" type="button" aria-label="Close">×</button>
      </div>

      <div class="rp-body">
        <div class="rp-row">
          <div class="rp-label">New Password</div>
          <input id="rpNew" class="rp-input" type="password" placeholder="Enter new password"/>
        </div>

        <div class="rp-row">
          <div class="rp-label">Confirm Password</div>
          <input id="rpConfirm" class="rp-input" type="password" placeholder="Re-enter new password"/>
        </div>

        <div id="rpErr" class="rp-err rp-hidden"></div>
      </div>

      <div class="rp-actions">
        <button class="rp-btn cancel" id="rpCancel" type="button">Cancel</button>
        <button class="rp-btn update" id="rpUpdate" type="button">Update Password</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin-teacher-passwords.js"></script>
</body>
</html>
