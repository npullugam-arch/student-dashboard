<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin • Password Reset</title>
  <link rel="stylesheet" href="/admin/admin-passwords.css"/>
</head>

<body>
  <div class="ap-wrap">

    <!-- Topbar -->
    <header class="ap-top">
      <div class="ap-brand">
        <div class="ap-logo">🔐</div>
        <div>
          <div class="ap-title">EduConnect</div>
          <div class="ap-sub">Admin • Reset Student Passwords</div>
        </div>
      </div>

      <div class="ap-actions">
        <button class="ap-btn ghost" id="btnBack" type="button">← Back</button>
        <button class="ap-btn dark" id="btnLogout" type="button">Logout</button>
      </div>
    </header>

    <!-- Filters -->
    <section class="ap-filters ap-card">
      <div class="ap-filter-grid">

        <label class="ap-field">
          <span>Class (Nursery=-2, LKG=-1, UKG=0, 1..12)</span>
          <select id="standard">
            <option value="">Select class</option>
            <option value="-2">Nursery</option>
            <option value="-1">LKG</option>
            <option value="0">UKG</option>
            <option value="1">Class 1</option>
            <option value="2">Class 2</option>
            <option value="3">Class 3</option>
            <option value="4">Class 4</option>
            <option value="5">Class 5</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </label>

        <label class="ap-field">
          <span>Section (manual)</span>
          <input id="section" placeholder="A" autocomplete="off"/>
        </label>

        <div class="ap-field ap-field-actions">
          <span>&nbsp;</span>
          <button class="ap-btn primary" id="btnLoad" type="button">Load Students</button>
        </div>

        <label class="ap-field ap-field-wide">
          <span>Search (Student ID / Name)</span>
          <div class="ap-searchbox">
            <span class="ap-search-ico">🔎</span>
            <input id="searchInput" type="text" placeholder="Type name or student ID..." autocomplete="off"/>
            <button class="ap-icon-btn" id="clearSearchBtn" type="button" title="Clear">✕</button>
          </div>
        </label>

      </div>

      <div class="ap-hint">
        Tip: Choose Class + Section → Load → then search by name/ID.
      </div>
    </section>

    <!-- Results -->
    <main class="ap-main">
      <section class="ap-card">
        <div class="ap-card-head">
          <h2>Students</h2>
          <div class="ap-meta">
            <span id="countPill" class="ap-pill">0</span>
            <span class="ap-muted" id="filterPill">No filter applied</span>
          </div>
        </div>

        <div id="list" class="ap-grid">
          <div class="ap-empty">
            Select class & section, then click <b>Load Students</b>.
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- ✅ Reset Password Modal -->
  <div id="rpBackdrop" class="rp-backdrop rp-hidden" aria-hidden="true">
    <div class="rp-modal" role="dialog" aria-modal="true" aria-labelledby="rpTitle">
      <div class="rp-head">
        <div>
          <h3 class="rp-title" id="rpTitle">Reset Password</h3>
          <p class="rp-sub" id="rpSub">Student: —</p>
        </div>
        <button class="rp-close" id="rpClose" type="button" aria-label="Close">×</button>
      </div>

      <div class="rp-body">
        <div class="rp-row">
          <div class="rp-label">New Password</div>
          <input id="rpNew" class="rp-input" type="password" placeholder="Enter new password"/>
        </div>

        <div class="rp-row">
          <div class="rp-label">Confirm Password</div>
          <input id="rpConfirm" class="rp-input" type="password" placeholder="Re-enter new password"/>
        </div>

        <div id="rpErr" class="rp-err rp-hidden"></div>
      </div>

      <div class="rp-actions">
        <button class="rp-btn cancel" id="rpCancel" type="button">Cancel</button>
        <button class="rp-btn update" id="rpUpdate" type="button">Update Password</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin-passwords.js"></script>
</body>
</html>
