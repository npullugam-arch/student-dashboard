<!-- ================================
✅ UPDATED FULL FILE: teacher-dashboard.html
✅ Only change (SAFE / Frontend-only):
1) Added Offline Guard script in <head> (same as student)
   - If internet OFF -> redirect to /offline.html
   - Registers /sw.js (optional, if you add that file)
✅ Everything else unchanged
================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="teacher-dashboard.css">

  <!-- ✅ tiny styles only for dashboard safe fixes (NO backend impact) -->
  <style>
    button, a, .nav-item, .mobile-menu-toggle, .notification-btn, #avatarBtn { cursor: pointer; }
    .muted { opacity:.75; }
    .holiday-item, .notice-item { cursor: default; }

    /* ✅ Mobile header fix (welcome + subtitle won't break layout) */
    .header { gap: 12px; }
    .header-left { min-width: 0; }
    #greetingTitle { margin: 0; }
    #greetingSub { margin: 6px 0 0; }

    @media (max-width: 576px){
      .header { align-items: flex-start; }
      .header-left h1{
        font-size: 18px !important;
        line-height: 1.2 !important;
        word-break: break-word;
      }
      .header-left p{
        font-size: 12px !important;
        line-height: 1.3 !important;
        word-break: break-word;
      }
      .profile-info { display:none; } /* ✅ keeps header clean on small screens */
    }

    /* ✅ Avatar image */
    .avatar-img{
      width:44px;
      height:44px;
      border-radius:50%;
      object-fit:cover;
      display:block;
    }

    /* ✅ BRAND LOGO IMAGE (prevents ugly border / keeps clean) */
    #brandLogoImg{
      width:40px;
      height:40px;
      border-radius:12px;
      object-fit:contain;
      background:transparent;
      border:none;
      box-shadow:none;
      display:block;
    }
  </style>

  <!-- ✅ OFFLINE GUARD (Frontend only)
       - If internet goes OFF -> redirect to /offline.html
       - When internet returns -> offline.html redirects back
       - Registers service worker /sw.js (optional but recommended)
  -->
  <script>
    (function () {
      function rememberUrl() {
        try {
          if (navigator.onLine) {
            sessionStorage.setItem("last_online_url", location.pathname + location.search + location.hash);
          }
        } catch {}
      }

      // Save current URL at start
      rememberUrl();

      // Keep saving when online
      window.addEventListener("online", rememberUrl);
      window.addEventListener("beforeunload", rememberUrl);

      // Redirect immediately when offline
      window.addEventListener("offline", () => {
        try {
          sessionStorage.setItem("last_online_url", location.pathname + location.search + location.hash);
        } catch {}
        if (location.pathname !== "/offline.html") {
          location.href = "/offline.html";
        }
      });

      // Register service worker (if file exists)
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    })();
  </script>

</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">

    <!-- ✅ UPDATED: branding from backend -->
    <div class="logo">
      <div class="logo-icon" id="brandLogoWrap">
        <img id="brandLogoImg" src="" alt="School Logo" style="display:none;">
        <i class="fas fa-graduation-cap" id="brandLogoFallback"></i>
      </div>
      <div class="logo-text" id="brandSchoolName">EduConnect</div>
    </div>

    <div class="nav-section">
      <div class="nav-title">Main Menu</div>

      <button class="nav-item active" data-page="dashboard" type="button">
        <i class="fas fa-th-large"></i>
        <span>Dashboard</span>
      </button>

      <button class="nav-item" data-page="classes" type="button">
        <i class="fas fa-chalkboard-teacher"></i>
        <span>My Classes</span>
      </button>

      <button class="nav-item" data-page="students" type="button">
        <i class="fas fa-users"></i>
        <span>Students</span>
      </button>

      <button class="nav-item" data-page="attendance" type="button">
        <i class="fas fa-user-check"></i>
        <span>Attendance</span>
      </button>

      <button class="nav-item" data-page="diary" type="button">
        <i class="fas fa-book"></i>
        <span>Diary</span>
      </button>

      <button class="nav-item" data-page="notes" type="button">
        <i class="fas fa-sticky-note"></i>
        <span>Short Notes</span>
      </button>

      <button class="nav-item" data-page="leave" type="button">
        <i class="fas fa-envelope"></i>
        <span>Student Leave Applications</span>
      </button>

      <button class="nav-item" data-page="doubts" type="button">
        <i class="fas fa-comments"></i>
        <span>Student Doubt Clarifications</span>
      </button>

      <button class="nav-item" data-page="exam-timetable" type="button">
        <i class="fas fa-calendar-alt"></i>
        <span>Exam Timetable</span>
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-title">Assessments</div>

      <button class="nav-item" data-page="results" type="button">
        <i class="fas fa-chart-bar"></i>
        <span>Exam Results</span>
      </button>

      <button class="nav-item" data-page="sheets" type="button">
        <i class="fas fa-file-alt"></i>
        <span>Answer Sheets</span>
      </button>

      <button class="nav-item" data-page="assignments" type="button">
        <i class="fas fa-clipboard-list"></i>
        <span>Assignments</span>
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-title">Account</div>
      <button class="nav-item" id="logoutBtn" type="button">
        <i class="fas fa-sign-out-alt"></i>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="mobile-menu-toggle" id="mobileMenuToggle" type="button" title="Menu">
        <i class="fas fa-bars"></i>
      </div>

      <div class="header-left">
        <h1 id="greetingTitle">Welcome 👋</h1>
        <!-- <p id="greetingSub">Here's what's happening with your classes today.</p> -->
      </div>

      <div class="header-right">
        <button class="notification-btn" id="notifBtnTeacher" type="button" title="Notifications" style="position:relative;">
          <i class="fas fa-bell"></i>

          <span class="notification-dot" id="notifDotTeacher" style="display:none;"></span>

          <span id="notifCountTeacher"
                style="display:none; position:absolute; top:-6px; right:-6px; min-width:20px; height:20px;
                       padding:0 6px; border-radius:999px; background:#ff3b30; color:#fff;
                       font-size:12px; line-height:20px; font-weight:700; text-align:center;">
            0
          </span>
        </button>

        <div class="profile">
          <div class="profile-info">
            <div class="profile-name" id="teacherFullName">Teacher</div>
            <div class="profile-role" id="teacherRoleText">Teacher</div>
          </div>

          <div class="profile-img" id="avatarBtn" title="Open Profile" style="
              width:44px;height:44px;border-radius:50%;
              display:flex;align-items:center;justify-content:center;
              font-weight:700;background:rgba(255,255,255,0.25);
              border:1px solid rgba(255,255,255,0.25);
              overflow:hidden;
            ">
            <span id="avatarLetter">T</span>
            <img id="avatarImg" class="avatar-img" src="" alt="Teacher" style="display:none;">
          </div>
        </div>
      </div>
    </header>

    <!-- Dashboard Home -->
    <div id="dashboardSection" class="content-section active">

      <!-- ✅ NEW: TODAY'S SCHEDULE -->
      <section class="schedule-section">
        <div class="schedule-header">
          <h2><i class="fas fa-calendar-day"></i> Today's Schedule</h2>
          <div class="schedule-date">
            <i class="fas fa-calendar"></i>
            <span id="currentDate"></span>
          </div>
        </div>

        <div class="schedule-grid" id="todayScheduleGrid">
          <div class="schedule-card">
            <div class="schedule-time">Loading…</div>
            <div class="schedule-class">—</div>
            <div class="schedule-subject">—</div>
          </div>
        </div>
      </section>
      <!-- ✅ END schedule -->

      <section class="info-section">
        <div class="info-card-large">
          <div class="info-card-header">
            <h3><i class="fas fa-calendar-times"></i> Upcoming Holidays</h3>
          </div>

          <div class="holiday-list" id="holidayListTeacher">
            <div class="holiday-item">
              <div class="holiday-details">
                <div class="holiday-name muted">Loading holidays...</div>
              </div>
            </div>
          </div>
        </div>

        <div class="info-card-large">
          <div class="info-card-header">
            <h3><i class="fas fa-bullhorn"></i> Important Notices</h3>
          </div>

          <div class="notice-list" id="noticeListTeacher">
            <div class="notice-item">
              <div class="notice-icon"><i class="fas fa-info-circle"></i></div>
              <div class="notice-content">
                <div class="notice-title">Loading…</div>
                <div class="notice-desc muted">Fetching latest notices</div>
                <div class="notice-time">...</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Dynamic section -->
    <div id="dynamicSection" class="content-section" style="display:none;">
      <div id="pageRoot"></div>

      <div class="info-card-large" id="helpPanel" style="display:none;">
        <div class="info-card-header">
          <h3><i class="fas fa-circle-question"></i> Help</h3>
        </div>
        <div style="padding:14px;">
          If something doesn’t load, login again.
        </div>
      </div>
    </div>
  </main>

  <script src="teacher-dashboard.js"></script>
</body>
</html>
