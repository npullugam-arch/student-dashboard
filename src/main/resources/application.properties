# Application
spring.application.name=student-portal
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable SQL script auto-run
spring.sql.init.mode=never

# Logging
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=INFO

# File Upload
app.upload.answer-sheets-dir=uploads/answer_sheets
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
