# Application
spring.application.name=student-portal
server.port=8080

# MySQL datasource (LOCAL)
spring.datasource.url=jdbc:mysql://localhost:3306/student_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=pass123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable SQL script auto-run (for now)
spring.sql.init.mode=never

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=INFO

app.upload.answer-sheets-dir=uploads/answer_sheets
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

